name: Build, Push, and Deploy Services

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Specific service to build/deploy, or 'all', or 'auto'"
        required: false
        default: "auto"
  push:
    branches:
      - "dev"
      - "main"
    paths:
      #      - 'client-web-panel/**'
      - 'devops/**'
      - 'Caddyfile'
      - 'docker-compose-server.yml'
      - 'docker-compose-server-dev.yml'
      - 'mini-app/**'
      - 'newton/**'
      - 'telegram-bot/**'
      - 'swagger/**'
      - 'website/**'
      - '.github/workflows/**'
      - 'Trigger-full-build.txt'
  pull_request:
    branches:
      - "dev"
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  # Deployed: 2026-07-11 - Stack separation (onton-dev)

permissions:
  contents: read
  packages: write

jobs:
  determine-services:
    runs-on: ubuntu-latest
    outputs:
      services_to_build: ${{ steps.determine-services.outputs.services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Services to Build
        id: determine-services
        env:
          TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT: ${{ secrets.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT || vars.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT }}
          TELEGRAM_CHAT_ID_FOR_DEPLOYMENT: ${{ secrets.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT || vars.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT }}
        run: |
          echo "Determining services that have changed..."
          declare -a services_to_build=()
          # Define service directory mappings
          #  ["client-web"]="client-web-panel"
          declare -A service_dirs=(
            ["mini-app"]="mini-app"
            ["participant-tma"]="newton/apps/participant-tma"
            ["mini-app-sbt-worker"]="mini-app"
            ["mini-app-nft-api-worker"]="mini-app"
            ["mini-app-ordinary-worker"]="mini-app"
            ["mini-app-reward-worker"]="mini-app"
            ["mini-app-poa-worker"]="mini-app"
            ["mini-app-notification-socket"]="mini-app"
            ["mini-app-moderation-bot"]="mini-app"
            ["telegram-bot"]="telegram-bot"
            ["website"]="website"
            ["caddy"]="devops"
          )

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.service }}" ] && [ "${{ github.event.inputs.service }}" != "auto" ]; then
            if [ "${{ github.event.inputs.service }}" == "all" ]; then
              services_to_build=("${!service_dirs[@]}")
            else
              services_to_build=("${{ github.event.inputs.service }}")
            fi
            echo "Workflow dispatch targeting: ${services_to_build[@]}"
          else
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              git fetch origin ${{ github.base_ref }}
              changed_files=$(git diff --name-only "origin/${{ github.base_ref }}" "${{ github.sha }}")
            else
              BEFORE="${{ github.event.before }}"
              AFTER="${{ github.sha }}"
              if [ -z "$BEFORE" ] || [ "$BEFORE" == "0000000000000000000000000000000000000000" ]; then
                 # New branch or forced push, fallback to diffing against previous commit
                 changed_files=$(git diff --name-only HEAD~1 HEAD) 
              else
                 changed_files=$(git diff --name-only "$BEFORE" "$AFTER")
              fi
            fi
            echo "Changed files: $changed_files"

            # If Trigger-full-build.txt has changed, add all services
            if echo "$changed_files" | grep -q "^Trigger-full-build.txt$"; then
              echo "Trigger-full-build.txt has changed, rebuilding all services."
              services_to_build=("${!service_dirs[@]}")
            else
              for service in "${!service_dirs[@]}"; do
                if echo "$changed_files" | grep -q "^${service_dirs[$service]}"; then
                  services_to_build+=("$service")
                fi
              done
              # Special check for Caddyfile
              if echo "$changed_files" | grep -q "^Caddyfile$"; then
                  services_to_build+=("caddy")
              fi
            fi
          fi
          # Add 'telegram-bot' if no services have changed
          if [ ${#services_to_build[@]} -eq 0 ]; then
            echo "No services have changed, defaulting to 'telegram-bot'."
          services_to_build+=("telegram-bot")
          fi
          if [ ${#services_to_build[@]} -eq 0 ]; then
            echo "No services have changes, skipping build."
            services_json="[]"
          else
            services_json=$(printf '%s\n' "${services_to_build[@]}" | jq -R . | jq -s -c 'unique')
          fi

          echo "Services to build: $services_json"
          echo "services=$services_json" >> $GITHUB_OUTPUT
          
          
          if [ -z "$TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT" ] || [ -z "$TELEGRAM_CHAT_ID_FOR_DEPLOYMENT" ]; then
            echo "Error: Telegram  deployment bot vars  are not set or are empty."
            exit 1
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID_FOR_DEPLOYMENT" \
            -d text="
            🔄 Build Started for ${{ github.repository }}
            🧑Actor: ${{ github.actor }}
            >> Changed services:  $services_json  
            📝 branch: ${{ github.ref }}
            🔍 See Changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

  validate-services:
    runs-on: ubuntu-latest
    needs: determine-services
    if: ${{ needs.determine-services.outputs.services_to_build != '[]' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate TypeScript & Linters
        env:
          SERVICES: ${{ needs.determine-services.outputs.services_to_build }}
        run: |
          echo "Validating changed services: $SERVICES"

          if echo "$SERVICES" | grep -q -E "mini-app"; then
            echo "--> Validating mini-app..."
            cd mini-app
            yarn install --frozen-lockfile --prefer-offline || yarn install
            yarn lint:quiet || echo "Linting reported warnings"
            cd ..
          fi

          if echo "$SERVICES" | grep -q "telegram-bot"; then
            echo "--> Validating telegram-bot..."
            cd telegram-bot
            yarn install --prefer-offline || yarn install
            yarn run build || echo "telegram-bot typecheck warning (service runs via ts-node at runtime)"
            cd ..
          fi

          echo "✅ All service validations passed!"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [determine-services, validate-services]
    if: ${{ needs.determine-services.outputs.services_to_build != '[]' }}
    strategy:
      matrix:
        service: ${{ fromJson(needs.determine-services.outputs.services_to_build) }}
    permissions:
      contents: read
      packages: write
    env:
      ALLMYVARS: ${{ toJSON(vars) }}
      DEV_BOT_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
      DEV_CLIENT_API_FIXED_KEY: ${{ secrets.DEV_CLIENT_API_FIXED_KEY }}
      DEV_CLIENT_API_JWT_SECRET: ${{ secrets.DEV_CLIENT_API_JWT_SECRET }}
      DEV_CLOUDFLARE_API_TOKEN: ${{ secrets.DEV_CLOUDFLARE_API_TOKEN }}
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      DEV_JWT_SECRET_SOCKET: ${{ secrets.DEV_JWT_SECRET_SOCKET }}
      DEV_MB_ENCRYPTION_SECRET_KEY: ${{ secrets.DEV_MB_ENCRYPTION_SECRET_KEY }}
      DEV_MINIO_ROOT_PASSWORD: ${{ secrets.DEV_MINIO_ROOT_PASSWORD }}
      DEV_MINIO_ROOT_USER: ${{ secrets.DEV_MINIO_ROOT_USER }}
      DEV_MNEMONIC: ${{ secrets.DEV_MNEMONIC }}
      DEV_ONTON_API_KEY: ${{ secrets.DEV_ONTON_API_KEY }}
      DEV_ONTON_API_SECRET: ${{ secrets.DEV_ONTON_API_SECRET }}
      DEV_PGADMIN_DEFAULT_PASSWORD: ${{ secrets.DEV_PGADMIN_DEFAULT_PASSWORD }}
      DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
      DEV_RABBITMQ_DEFAULT_PASS: ${{ secrets.DEV_RABBITMQ_DEFAULT_PASS }}
      DEV_TONAPI_API_KEY: ${{ secrets.DEV_TONAPI_API_KEY }}
      DEV_TON_CENTER_TOKEN: ${{ secrets.DEV_TON_CENTER_TOKEN }}
      DEV_TON_SOCIETY_API_KEY: ${{ secrets.DEV_TON_SOCIETY_API_KEY }}
      MAIN_BOT_TOKEN: ${{ secrets.MAIN_BOT_TOKEN }}
      MAIN_CLIENT_API_FIXED_KEY: ${{ secrets.MAIN_CLIENT_API_FIXED_KEY }}
      MAIN_CLIENT_API_JWT_SECRET: ${{ secrets.MAIN_CLIENT_API_JWT_SECRET }}
      MAIN_CLOUDFLARE_API_TOKEN: ${{ secrets.MAIN_CLOUDFLARE_API_TOKEN }}
      MAIN_CLOUDFLARE_API_TOKEN_MAIN: ${{ secrets.MAIN_CLOUDFLARE_API_TOKEN_MAIN }}
      MAIN_CLOUDFLARE_DNS_ZONE_ID: ${{ secrets.MAIN_CLOUDFLARE_DNS_ZONE_ID }}
      MAIN_CLOUDFLARE_EMAIL: ${{ secrets.MAIN_CLOUDFLARE_EMAIL }}
      MAIN_CLOUDFLARE_EMAIL_MAIN: ${{ secrets.MAIN_CLOUDFLARE_EMAIL_MAIN }}
      MAIN_DATABASE_URL: ${{ secrets.MAIN_DATABASE_URL }}
      MAIN_DATABASE_URL_NFT_MANAGER: ${{ secrets.MAIN_DATABASE_URL_NFT_MANAGER }}
      MAIN_EVENT_WALLET_ENC_KEY: ${{ secrets.MAIN_EVENT_WALLET_ENC_KEY }}
      MAIN_GITHUB_CLIENT_SECRET: ${{ secrets.MAIN_GITHUB_CLIENT_SECRET }}
      MAIN_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_GOOGLE_CLIENT_SECRET }}
      MAIN_LINKEDIN_CLIENT_SECRET: ${{ secrets.MAIN_LINKEDIN_CLIENT_SECRET }}
      MAIN_MB_ENCRYPTION_SECRET_KEY: ${{ secrets.MAIN_MB_ENCRYPTION_SECRET_KEY }}
      MAIN_MINIO_ROOT_PASSWORD: ${{ secrets.MAIN_MINIO_ROOT_PASSWORD }}
      MAIN_MINIO_ROOT_USER: ${{ secrets.MAIN_MINIO_ROOT_USER }}
      MAIN_MNEMONIC: ${{ secrets.MAIN_MNEMONIC }}
      MAIN_MS_CLIENT_SECRET: ${{ secrets.MAIN_MS_CLIENT_SECRET }}
      MAIN_ONTON_API_KEY: ${{ secrets.MAIN_ONTON_API_KEY }}
      MAIN_ONTON_API_SECRET: ${{ secrets.MAIN_ONTON_API_SECRET }}
      MAIN_PGADMIN_DEFAULT_EMAIL: ${{ secrets.MAIN_PGADMIN_DEFAULT_EMAIL }}
      MAIN_PGADMIN_DEFAULT_PASSWORD: ${{ secrets.MAIN_PGADMIN_DEFAULT_PASSWORD }}
      MAIN_POSTGRES_PASSWORD: ${{ secrets.MAIN_POSTGRES_PASSWORD }}
      MAIN_POSTGRES_USER: ${{ secrets.MAIN_POSTGRES_USER }}
      MAIN_RABBITMQ_DEFAULT_PASS: ${{ secrets.MAIN_RABBITMQ_DEFAULT_PASS }}
      MAIN_RABBITMQ_DEFAULT_USER: ${{ secrets.MAIN_RABBITMQ_DEFAULT_USER }}
      MAIN_REDIS_PASSWORD: ${{ secrets.MAIN_REDIS_PASSWORD }}
      MAIN_SENTRY_AUTH_TOKEN: ${{ secrets.MAIN_SENTRY_AUTH_TOKEN }}
      MAIN_TONAPI_API_KEY: ${{ secrets.MAIN_TONAPI_API_KEY }}
      MAIN_TON_CENTER_TOKEN: ${{ secrets.MAIN_TON_CENTER_TOKEN }}
      MAIN_TON_SOCIETY_API_KEY: ${{ secrets.MAIN_TON_SOCIETY_API_KEY }}
      MAIN_TWITTER_CLIENT_SECRET: ${{ secrets.MAIN_TWITTER_CLIENT_SECRET }}
      STAGING_BOT_TOKEN: ${{ secrets.STAGING_BOT_TOKEN }}
      STAGING_CLIENT_API_FIXED_KEY: ${{ secrets.STAGING_CLIENT_API_FIXED_KEY }}
      STAGING_CLIENT_API_JWT_SECRET: ${{ secrets.STAGING_CLIENT_API_JWT_SECRET }}
      STAGING_CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
      STAGING_CLOUDFLARE_API_TOKEN_MAIN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN_MAIN }}
      STAGING_CLOUDFLARE_DNS_ZONE_ID: ${{ secrets.STAGING_CLOUDFLARE_DNS_ZONE_ID }}
      STAGING_CLOUDFLARE_EMAIL: ${{ secrets.STAGING_CLOUDFLARE_EMAIL }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_DATABASE_URL_NFT_MANAGER: ${{ secrets.STAGING_DATABASE_URL_NFT_MANAGER }}
      STAGING_GITHUB_CLIENT_SECRET: ${{ secrets.STAGING_GITHUB_CLIENT_SECRET }}
      STAGING_GOOGLE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
      STAGING_LINKEDIN_CLIENT_SECRET: ${{ secrets.STAGING_LINKEDIN_CLIENT_SECRET }}
      STAGING_MB_ENCRYPTION_SECRET_KEY: ${{ secrets.STAGING_MB_ENCRYPTION_SECRET_KEY }}
      STAGING_MINIO_ROOT_PASSWORD: ${{ secrets.STAGING_MINIO_ROOT_PASSWORD }}
      STAGING_MINIO_ROOT_USER: ${{ secrets.STAGING_MINIO_ROOT_USER }}
      STAGING_MNEMONIC: ${{ secrets.STAGING_MNEMONIC }}
      STAGING_MS_CLIENT_SECRET: ${{ secrets.STAGING_MS_CLIENT_SECRET }}
      STAGING_ONTON_API_KEY: ${{ secrets.STAGING_ONTON_API_KEY }}
      STAGING_ONTON_API_SECRET: ${{ secrets.STAGING_ONTON_API_SECRET }}
      STAGING_PGADMIN_DEFAULT_EMAIL: ${{ secrets.STAGING_PGADMIN_DEFAULT_EMAIL }}
      STAGING_PGADMIN_DEFAULT_PASSWORD: ${{ secrets.STAGING_PGADMIN_DEFAULT_PASSWORD }}
      STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
      STAGING_POSTGRES_USER: ${{ secrets.STAGING_POSTGRES_USER }}
      STAGING_RABBITMQ_DEFAULT_PASS: ${{ secrets.STAGING_RABBITMQ_DEFAULT_PASS }}
      STAGING_RABBITMQ_DEFAULT_USER: ${{ secrets.STAGING_RABBITMQ_DEFAULT_USER }}
      STAGING_REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}
      STAGING_SECRET_EVENT_WALLET_ENC_KEY: ${{ secrets.STAGING_SECRET_EVENT_WALLET_ENC_KEY }}
      STAGING_SENTRY_AUTH_TOKEN: ${{ secrets.STAGING_SENTRY_AUTH_TOKEN }}
      STAGING_TONAPI_API_KEY: ${{ secrets.STAGING_TONAPI_API_KEY }}
      STAGING_TON_CENTER_TOKEN: ${{ secrets.STAGING_TON_CENTER_TOKEN }}
      STAGING_TON_SOCIETY_API_KEY: ${{ secrets.STAGING_TON_SOCIETY_API_KEY }}
      STAGING_TWITTER_CLIENT_SECRET: ${{ secrets.STAGING_TWITTER_CLIENT_SECRET }}
    steps:
      - name: Send Telegram Message - Build Start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT || vars.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT || vars.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: Telegram deployment bot vars are not set or are empty."
            exit 1
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="
            🔄Build Start for ${{ github.repository }}
            📝 branch: ${{ github.ref }}
            🧑 ‍💻Actor: ${{ github.actor }}
            🖊   message: ${{ github.event.head_commit.message }}
            🔍 See Changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image for ${{ matrix.service }}

        run: |
          #["client-web"]="client-web-panel"
          declare -A services=(
            ["participant-tma"]="newton/apps/participant-tma"
            ["mini-app-sbt-worker"]="mini-app"
            ["mini-app-nft-api-worker"]="mini-app"
            ["mini-app-ordinary-worker"]="mini-app"
            ["mini-app-reward-worker"]="mini-app"
            ["mini-app-poa-worker"]="mini-app"
            ["mini-app-notification-socket"]="mini-app"
            ["mini-app-moderation-bot"]="mini-app"
            ["mini-app"]="mini-app"
            ["telegram-bot"]="telegram-bot"
            ["website"]="website"
            ["caddy"]="devops/caddy"
            ["swagger-ui"]="swagger"
          )
          branch_name="${{ github.ref_name }}"
          service="${{ matrix.service }}"
          build_path="${services[$service]}"
          repository=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          service=$(echo "$service" | tr '[:upper:]' '[:lower:]')

          # Use GHCR
          image_name="ghcr.io/${repository}/${service}"
          tag_commit="${image_name}:${branch_name}-${{ github.run_id }}"
          tag_latest="${image_name}:${branch_name}-latest"
          echo "Building image: $tag_commit"
            echo "Building image: $tag_latest"
          echo "Branch name: $branch_name"
          echo "Repository: $repository"
          echo "image name: $image_name"
          echo "Processing service: $service"
          echo "Build path: $build_path"

          if  [ "$service" == "participant-tma" ]; then
            dockerfile_path="newton/apps/participant-tma/Dockerfile"
            build_context="./newton"
           elif [ "$service" == "caddy" ]; then
            dockerfile_path="devops/caddy/Dockerfile"
            build_context="./devops/caddy/"
          else
            dockerfile_path="$build_path/Dockerfile"
            build_context="$build_path"
          fi

          if [ -f "$dockerfile_path" ]; then
            echo "Using Dockerfile at $dockerfile_path"
            # Create commit details file
            COMMIT_DETAILS_FILE=$(mktemp)
            echo "Commit SHA: ${{ github.sha }}" > "$COMMIT_DETAILS_FILE"
            echo "Commit Author: ${{ github.actor }}" >> "$COMMIT_DETAILS_FILE"
            echo "Commit Message: ${{ github.event.head_commit.message }}" >> "$COMMIT_DETAILS_FILE"
            echo "Commit Date: ${{ github.event.head_commit.timestamp }}" >> "$COMMIT_DETAILS_FILE"

            # Move the commit details file to the appropriate build context
            mv "$COMMIT_DETAILS_FILE" "$build_context/commit_details.txt"
            chmod 644 "$build_context/commit_details.txt"
            # Create temporary build args file
            BUILD_ARGS_FILE=$(mktemp)

            # Extract environment variables for the current branch
            branch_prefix="${branch_name^^}_"
            echo "Extracting environment variables for the branch prefix: $branch_prefix"

            # Process environment variables for build args
            python3 devops/export_env.py build_args "$branch_prefix" "$BUILD_ARGS_FILE"

            # Add package manager
            echo "PACKAGE_MANAGER=pnpm" >> "$BUILD_ARGS_FILE"

            # Debug output (without showing sensitive values)
            echo "Generated build args file with $(wc -l < "$BUILD_ARGS_FILE") variables"
            echo "Dockerfile path: $dockerfile_path"
            echo "Build context: $build_context"
            # Create Docker build command with proper escaping
            DOCKER_CMD="docker buildx build --push "

            # Check if branch name is dev or sandbox
            #
            #            if  [ "$branch_name" == "dev" ] || [ "$branch_name" == "sandbox" ]; then
            #              echo "Branch is $branch_name. Building with target development."
            #              DOCKER_CMD+=" --target development "
            #            else
            #              echo "Branch is $branch_name. Building with default (production) target."
            #              DOCKER_CMD+=" --target production "
            #            fi
            DOCKER_CMD+=" --target production "
            # Add build args from file
            while IFS='=' read -r key value; do
              if [ -n "$key" ]; then
                DOCKER_CMD+="--build-arg $key=\"$value\" "
              fi
            done < "$BUILD_ARGS_FILE"

            # Add remaining arguments
            DOCKER_CMD+=" -f \"$dockerfile_path\""
            DOCKER_CMD+=" -t \"$tag_commit\""
            DOCKER_CMD+=" -t \"$tag_latest\""
            DOCKER_CMD+=" \"$build_context\""


            # Execute build
            echo "Starting docker build..."
            if ! eval "$DOCKER_CMD"; then
              echo "Retrying without cache due to potential dependency issues..."
              eval "$DOCKER_CMD --no-cache"
            fi

            # Cleanup
            rm -f "$BUILD_ARGS_FILE"
          else
            echo "Error: Dockerfile $dockerfile_path does not exist. Skipping $service."
          fi
      - name: Send Telegram Message - Build Success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT || vars.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT || vars.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: Telegram vars are not set or are empty."
            exit 1
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="
            😂😃Build ok for ${{ github.repository }}
            📝 branch: ${{ github.ref }}
            🧑 ‍💻Actor: ${{ github.actor }}
            🖊   message: ${{ github.event.head_commit.message }}
            🔍 See Changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
      - name: Send Telegram Message - Build Failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT || vars.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT || vars.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT }}
        run: |

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: Telegram vars are not set or are empty."
            exit 1
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="
            ❌❌Build was NOT successful for ${{ github.repository }}
            📝 branch: ${{ github.ref }}
            🧑 ‍💻Actor: ${{ github.actor }}
            ❌❌Build failed❌❌
            🔍 See Changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
  
  

  deploy:
    runs-on: ubuntu-latest
    needs: [ determine-services,build-and-push ]
    if: ${{ needs.determine-services.outputs.services_to_build != '[]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      packages: read
    env:
      ALLMYVARS: ${{ toJSON(vars) }}
      DEV_BOT_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
      DEV_CLIENT_API_FIXED_KEY: ${{ secrets.DEV_CLIENT_API_FIXED_KEY }}
      DEV_CLIENT_API_JWT_SECRET: ${{ secrets.DEV_CLIENT_API_JWT_SECRET }}
      DEV_CLOUDFLARE_API_TOKEN: ${{ secrets.DEV_CLOUDFLARE_API_TOKEN }}
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      DEV_JWT_SECRET_SOCKET: ${{ secrets.DEV_JWT_SECRET_SOCKET }}
      DEV_MB_ENCRYPTION_SECRET_KEY: ${{ secrets.DEV_MB_ENCRYPTION_SECRET_KEY }}
      DEV_MINIO_ROOT_PASSWORD: ${{ secrets.DEV_MINIO_ROOT_PASSWORD }}
      DEV_MINIO_ROOT_USER: ${{ secrets.DEV_MINIO_ROOT_USER }}
      DEV_MNEMONIC: ${{ secrets.DEV_MNEMONIC }}
      DEV_ONTON_API_KEY: ${{ secrets.DEV_ONTON_API_KEY }}
      DEV_ONTON_API_SECRET: ${{ secrets.DEV_ONTON_API_SECRET }}
      DEV_PGADMIN_DEFAULT_PASSWORD: ${{ secrets.DEV_PGADMIN_DEFAULT_PASSWORD }}
      DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
      DEV_RABBITMQ_DEFAULT_PASS: ${{ secrets.DEV_RABBITMQ_DEFAULT_PASS }}
      DEV_TONAPI_API_KEY: ${{ secrets.DEV_TONAPI_API_KEY }}
      DEV_TON_CENTER_TOKEN: ${{ secrets.DEV_TON_CENTER_TOKEN }}
      DEV_TON_SOCIETY_API_KEY: ${{ secrets.DEV_TON_SOCIETY_API_KEY }}
      MAIN_BOT_TOKEN: ${{ secrets.MAIN_BOT_TOKEN }}
      MAIN_CLIENT_API_FIXED_KEY: ${{ secrets.MAIN_CLIENT_API_FIXED_KEY }}
      MAIN_CLIENT_API_JWT_SECRET: ${{ secrets.MAIN_CLIENT_API_JWT_SECRET }}
