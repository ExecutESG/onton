name: Build, Push, and Deploy Services

on:
  push:
    branches:
      - "dev"
      - "main"
    paths:
      #      - 'client-web-panel/**'
      - 'devops/**'
      - 'docker-compose-server.yml'
      - 'docker-compose-server-dev.yml'
      - 'mini-app/**'
      - 'newton/**'
      - 'telegram-bot/**'
      - 'swagger/**'
      - 'website/**'
      - '.github/workflows/**'
      - 'Trigger-full-build.txt'
  pull_request:
    branches:
      - "dev"
      - "main"
jobs:
  determine-services:
    runs-on: ubuntu-latest
    outputs:
      services_to_build: ${{ steps.determine-services.outputs.services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Services to Build
        id: determine-services
        env:
          TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT: ${{ vars.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT }}
          TELEGRAM_CHAT_ID_FOR_DEPLOYMENT: ${{ vars.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT }}
        run: |
          echo "Determining services that have changed..."
          changed_files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Changed files: $changed_files"
          declare -a services_to_build=()
          # Define service directory mappings
          #  ["client-web"]="client-web-panel"
          declare -A service_dirs=(
            ["mini-app"]="mini-app"
            ["participant-tma"]="newton/apps/participant-tma"
            ["mini-app-sbt-worker"]="mini-app"
            ["mini-app-nft-api-worker"]="mini-app"
            ["mini-app-ordinary-worker"]="mini-app"
            ["mini-app-reward-worker"]="mini-app"
            ["mini-app-poa-worker"]="mini-app"
            ["mini-app-notification-socket"]="mini-app"
            ["mini-app-moderation-bot"]="mini-app"
            ["telegram-bot"]="telegram-bot"
            ["website"]="website"
            ["caddy"]="devops"
            ["swagger-ui"]="swagger"
          )
          # If Trigger-full-build.txt has changed, add all services
          if echo "$changed_files" | grep -q "^Trigger-full-build.txt$"; then
            echo "Trigger-full-build.txt has changed, rebuilding all services."
            services_to_build=("${!service_dirs[@]}")
          else
            for service in "${!service_dirs[@]}"; do
              if echo "$changed_files" | grep -q "^${service_dirs[$service]}"; then
                services_to_build+=("$service")
              fi
            done
          fi
          # Add 'telegram-bot' if no services have changed
          if [ ${#services_to_build[@]} -eq 0 ]; then
            echo "No services have changed, defaulting to 'telegram-bot'."
          services_to_build+=("telegram-bot")
          fi
          if [ ${#services_to_build[@]} -eq 0 ]; then
            echo "No services have changes, skipping build."
            services_json="[]"
          else
            services_json=$(printf '%s\n' "${services_to_build[@]}" | jq -R . | jq -s -c .)
          fi

          echo "Services to build: $services_json"
          echo "services=$services_json" >> $GITHUB_OUTPUT
          
          
          if [ -z "TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT" ] || [ -z "$TELEGRAM_CHAT_ID_FOR_DEPLOYMENT" ]; then
            echo "Error: Telegram  deployment bot vars  are not set or are empty."
            exit 1
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID_FOR_DEPLOYMENT" \
            -d text="
            🔄 Build Started for ${{ github.repository }}
            🧑Actor: ${{ github.actor }}
            >> Changed services:  $services_json  
            📝 branch: ${{ github.ref }}
            🔍 See Changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

  build-and-push:
    runs-on: ubuntu-latest
    needs: determine-services
    if: ${{ needs.determine-services.outputs.services_to_build != '[]' }}
    strategy:
      matrix:
        service: ${{ fromJson(needs.determine-services.outputs.services_to_build) }}
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      ALLMYSECRETS: ${{ toJSON(secrets) }}
      ALLMYVARS: ${{ toJSON(vars) }}
    steps:
      - name: Send Telegram Message - Build Start
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: Telegram deployment bot vars are not set or are empty."
            exit 1
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="
            🔄Build Start for ${{ github.repository }}
            📝 branch: ${{ github.ref }}
            🧑 ‍💻Actor: ${{ github.actor }}
            🖊   message: ${{ github.event.head_commit.message }}
            🔍 See Changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image for ${{ matrix.service }}

        run: |
          #["client-web"]="client-web-panel"
          declare -A services=(
            ["participant-tma"]="newton/apps/participant-tma"
            ["mini-app-sbt-worker"]="mini-app"
            ["mini-app-nft-api-worker"]="mini-app"
            ["mini-app-ordinary-worker"]="mini-app"
            ["mini-app-reward-worker"]="mini-app"
            ["mini-app"]="mini-app"
            ["telegram-bot"]="telegram-bot"
            ["website"]="website"
            ["caddy"]="devops/caddy"
          )
          branch_name="${{ github.ref_name }}"
          service="${{ matrix.service }}"
          build_path="${services[$service]}"
          repository=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          service=$(echo "$service" | tr '[:upper:]' '[:lower:]')

          # Use GHCR
          image_name="ghcr.io/${repository}/${service}"
          tag_commit="${image_name}:${branch_name}-${{ github.run_id }}"
          tag_latest="${image_name}:${branch_name}-latest"
          echo "Building image: $tag_commit"
            echo "Building image: $tag_latest"
          echo "Branch name: $branch_name"
          echo "Repository: $repository"
          echo "image name: $image_name"
          echo "Processing service: $service"
          echo "Build path: $build_path"

          if  [ "$service" == "participant-tma" ]; then
            dockerfile_path="newton/apps/participant-tma/Dockerfile"
            build_context="./newton"
           elif [ "$service" == "caddy" ]; then
            dockerfile_path="devops/caddy/Dockerfile"
            build_context="./devops/caddy/"
          else
            dockerfile_path="$build_path/Dockerfile"
            build_context="$build_path"
          fi

          if [ -f "$dockerfile_path" ]; then
            echo "Using Dockerfile at $dockerfile_path"
            # Create commit details file
            COMMIT_DETAILS_FILE=$(mktemp)
            echo "Commit SHA: ${{ github.sha }}" > "$COMMIT_DETAILS_FILE"
            echo "Commit Author: ${{ github.actor }}" >> "$COMMIT_DETAILS_FILE"
            echo "Commit Message: ${{ github.event.head_commit.message }}" >> "$COMMIT_DETAILS_FILE"
            echo "Commit Date: ${{ github.event.head_commit.timestamp }}" >> "$COMMIT_DETAILS_FILE"

            # Move the commit details file to the appropriate build context
            mv "$COMMIT_DETAILS_FILE" "$build_context/commit_details.txt"
            chmod 644 "$build_context/commit_details.txt"
            # Create temporary build args file
            BUILD_ARGS_FILE=$(mktemp)

            # Extract environment variables for the current branch
            branch_prefix="${branch_name^^}_"
            echo "Extracting environment variables for the branch prefix: $branch_prefix"

            # Function to safely process environment variables
            process_env_vars() {
              local json_str="$1"
              local prefix="$2"
              local outfile="$3"

              # Ensure JSON is properly formatted
              echo "$json_str" | jq -r --arg prefix "$prefix" \
                'with_entries(select(.key | startswith($prefix))) |
                to_entries[] |
                "\(.key | sub($prefix; ""))=\(.value)"' >> "$outfile" || true
            }

            # Process secrets with error handling
            if [ -n "$ALLMYSECRETS" ]; then
              echo "Processing secrets..."
              process_env_vars "$ALLMYSECRETS" "$branch_prefix" "$BUILD_ARGS_FILE"

            fi

            # Process vars with error handling
            if [ -n "$ALLMYVARS" ]; then
              echo "Processing vars..."
              process_env_vars "$ALLMYVARS" "$branch_prefix" "$BUILD_ARGS_FILE"
            fi

            # Add package manager
            echo "PACKAGE_MANAGER=pnpm" >> "$BUILD_ARGS_FILE"

            # Debug output (without showing sensitive values)
            echo "Generated build args file with $(wc -l < "$BUILD_ARGS_FILE") variables"
            echo "Dockerfile path: $dockerfile_path"
            echo "Build context: $build_context"
            # Create Docker build command with proper escaping
            DOCKER_CMD="docker buildx build --push "

            # Check if branch name is dev or sandbox
            #
            #            if  [ "$branch_name" == "dev" ] || [ "$branch_name" == "sandbox" ]; then
            #              echo "Branch is $branch_name. Building with target development."
            #              DOCKER_CMD+=" --target development "
            #            else
            #              echo "Branch is $branch_name. Building with default (production) target."
            #              DOCKER_CMD+=" --target production "
            #            fi
            DOCKER_CMD+=" --target production "
            # Add build args from file
            while IFS='=' read -r key value; do
              if [ -n "$key" ]; then
                DOCKER_CMD+="--build-arg $key=\"$value\" "
              fi
            done < "$BUILD_ARGS_FILE"

            # Add remaining arguments
            DOCKER_CMD+=" -f \"$dockerfile_path\""
            DOCKER_CMD+=" -t \"$tag_commit\""
            DOCKER_CMD+=" -t \"$tag_latest\""
            DOCKER_CMD+=" \"$build_context\""


            # Execute build
            echo "Starting docker build..."
            if ! eval "$DOCKER_CMD"; then
              echo "Retrying without cache due to potential dependency issues..."
              eval "$DOCKER_CMD --no-cache"
            fi

            # Cleanup
            rm -f "$BUILD_ARGS_FILE"
          else
            echo "Error: Dockerfile $dockerfile_path does not exist. Skipping $service."
          fi
      - name: Send Telegram Message - Build Success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: Telegram vars are not set or are empty."
            exit 1
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="
            😂😃Build ok for ${{ github.repository }}
            📝 branch: ${{ github.ref }}
            🧑 ‍💻Actor: ${{ github.actor }}
            🖊   message: ${{ github.event.head_commit.message }}
            🔍 See Changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
      - name: Send Telegram Message - Build Failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT }}
        run: |

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: Telegram vars are not set or are empty."
            exit 1
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="
            ❌❌Build was NOT successful for ${{ github.repository }}
            📝 branch: ${{ github.ref }}
            🧑 ‍💻Actor: ${{ github.actor }}
            ❌❌Build failed❌❌
            🔍 See Changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
  
  

  deploy:
    runs-on: ubuntu-latest
    needs: [ determine-services,build-and-push ]
    if: ${{ needs.determine-services.outputs.services_to_build != '[]' && github.event_name == 'push' }}
    permissions:
      contents: write
      packages: read
      actions: write
      id-token: write
    env:
      ALLMYSECRETS: ${{ toJSON(secrets) }}
      ALLMYVARS: ${{ toJSON(vars) }}
    steps:
      #      - name: Manual Approval
      #        if: |
      #          github.ref_name == 'main' ||
      #          github.ref_name == 'staging'
      #        uses: trstringer/manual-approval@v1
      #        with:
      #          secret: ${{ github.token }}
      #          approvers: ${{ github.actor }}
      #          minimum-approvals: 1
      #          issue-title: "Deploying to ${{ github.ref_name }} branch"
      #          issue-body: "Please approve or deny the deployment to ${{ github.ref_name }} branch"
      #          exclude-workflow-initiator-as-approver: false
      #          additional-approved-words: 'approve,approved,lgtm,yes'
      #          additional-denied-words: 'deny,denied,no'
      - name: Start SSH Agent and Add Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Environment Variables .env File
        id: generate-env-script
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        run: |
          branch_name="${{ github.ref_name }}"
          prefix="${branch_name^^}_"
          github_repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          env_file=".env"
          
          echo "Generating environment variables script for prefix: $prefix"
          
          # Create or truncate the env file if it already exists
          > $env_file
          
          
          # Extract GitHub secrets and environment variables from ALLMYSECRETS and ALLMYVARS
          secrets_json="${ALLMYSECRETS}"
          vars_json="${ALLMYVARS}"
          
          echo "$secrets_json" | jq -r --arg prefix "$prefix" \
            'to_entries[] | select(.key | startswith($prefix)) | "\(.key[$prefix | length:])=\(.value | @sh)"' >> $env_file
          
          echo "$vars_json" | jq -r --arg prefix "$prefix" \
            'to_entries[] | select(.key | startswith($prefix)) | "\(.key[$prefix | length:])=\(.value | @sh)"' >> $env_file
          
          # Strip quotes from numeric values to prevent Docker Swarm port mapping errors
          sed -i "s/'\([0-9]*\)'/\1/g" $env_file
          
          # Add branch name as env also
          echo "BRANCH_NAME=$branch_name" >> $env_file
          # Add github repo as env also
          echo "GITHUB_REPO=$github_repo" >> $env_file
          # Add the GitHub Container Registry PAT to the env file
          echo "CR_PAT=${CR_PAT}" >> $env_file
          echo "REGISTRY_URL=ghcr.io" >> $env_file
          
          echo "Environment variables script generated successfully."


      - name: Set up SSH Environment Variables
        id: set-env-vars
        run: |
          echo "Setting up SSH environment variables..."
          branch_name="${{ github.ref_name }}"

          # Use case-insensitive prefix matching for branch name
          if [[ "$branch_name" == "dev" ]]; then
            echo "SSH_IP=${{ secrets.SSH_DEV_IP }}" >> $GITHUB_ENV
            echo "SSH_PORT=${{ secrets.SSH_DEV_PORT }}" >> $GITHUB_ENV
          elif [[ "$branch_name" == "main" ]]; then
            echo "SSH_IP=${{ secrets.SSH_MAIN_IP }}" >> $GITHUB_ENV
            echo "SSH_PORT=${{ secrets.SSH_MAIN_PORT }}" >> $GITHUB_ENV
          elif [[ "$branch_name" == "staging" ]]; then
            echo "SSH_IP=${{ secrets.SSH_STAGING_IP }}" >> $GITHUB_ENV
            echo "SSH_PORT=${{ secrets.SSH_STAGING_PORT }}" >> $GITHUB_ENV
          else
            echo "Error: Unknown branch name, unable to set SSH credentials."
            exit 1
          fi

      - name: Set up Compose File Variable
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "COMPOSE_FILE=docker-compose-server-dev.yml" >> $GITHUB_ENV
          else
            echo "COMPOSE_FILE=docker-compose-server.yml" >> $GITHUB_ENV
          fi

      - name: Deploy Changed Services
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        run: |
          branch_name="${{ github.ref_name }}"
          registry_url="ghcr.io"
          github_repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ssh_ip="${SSH_IP}"
          ssh_port="${SSH_PORT}"
          services_to_build=${{ needs.determine-services.outputs.services_to_build }}   
          echo "Connecting to server and creating branch directory..."
          ssh -o StrictHostKeyChecking=no -p "$ssh_port" tonont@$ssh_ip << EOF
            mkdir -p /home/tonont/$branch_name
            echo "Creating network if not exists..."

          EOF

          echo "Copying files to server..."
          scp  -P "$ssh_port"  -r -o StrictHostKeyChecking=no  docker-compose-server.yml docker-compose-server-dev.yml .env docker-compose-server.volume.dev.yml .dockerignore swagger devops tonont@$ssh_ip:/home/tonont/$branch_name
          
          
          # Remove brackets and convert to space-separated string
          services=$(echo "$services_to_build" | tr -d '[]"' | tr ',' ' ')
          echo "Formatted services to build: $services"  # Debug output        
          ssh -p "$ssh_port" -o StrictHostKeyChecking=no tonont@$ssh_ip << EOF
            set -o errexit
            set -o pipefail
            whoami
            echo "Moving to branch directory..."
            cd /home/tonont/$branch_name
            echo "Loading environment variables..."
            set -a
            source .env
            set +a
            echo "******Logging into GitHub Container Registry..."
            if [ -z "$CR_PAT" ]; then
              echo "CR_PAT is not set or is empty. Please add CR_PAT to GitHub Secrets."; exit 1;
            fi
            echo "$CR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 
          
            echo "services to build: $services_to_build"
            # Remove the square brackets and split by comma
            echo "Pulling latest images of changed services..."
            for service in $services; do
              echo "Processing service: \$service"
              if [ -z "\$service" ]; then
                echo "Warning: Found an empty service name, skipping..."
              else
                echo "Pulling Docker image for service: \$service"
                docker pull ghcr.io/${github_repo}/\${service}:${branch_name}-latest
              fi
              if [[ "\$service" == "caddy" ]]; then
                echo "creating caady files"
                  echo "Listing files in branch directory..."        
                  cd /home/tonont/$branch_name
                  echo "Sourcing .env file..."
                  set -o allexport
                  source .env
                  set +o allexport
                  source /home/tonont/$branch_name/.env
                  chmod +x devops/generate-caddyfile-by-address.sh
                   rm -f /home/tonont/$branch_name/Caddyfile
                   export CADDYFILE_PATH="/home/tonont/$branch_name/Caddyfile"
                   sh devops/generate-caddyfile-by-address.sh
                   echo "Caddyfile generated successfully."
              fi
            done
          EOF
          echo "Exporting all environment variables with branch-specific prefix..."
          
          ssh  -p "$ssh_port" -o StrictHostKeyChecking=no tonont@$ssh_ip << EOF
            set -o errexit
            set -o pipefail
            echo "Moving to branch directory..."
            cd /home/tonont/$branch_name
            ls -la
            echo "Sourcing .env file with auto-export..."
            set -a
            source .env
            set +a
            chmod +x devops/generate-caddyfile.sh
            chmod +x devops/minio-init.sh
            echo "Updating Docker node label for stage $branch_name..."
            
            # Try to get Node ID (Best Effort)
            NODE_ID=""
            if docker info > /dev/null 2>&1; then
                # Method 1: Docker Info Format
                NODE_ID=$(docker info --format '{{.Swarm.NodeID}}' 2>/dev/null || true)
                
                # Method 2: Grep Fallback
                if [ -z "$NODE_ID" ]; then
                     NODE_ID=$(docker info 2>/dev/null | grep "NodeID:" | awk '{print $2}')
                fi
            fi

            if [ -n "$NODE_ID" ]; then
                echo "Node ID found: $NODE_ID. Updating labels..."
                docker node update --label-add stage.$branch_name=true $NODE_ID || true
            else
                echo "WARNING: Could not retrieve Node ID. Skipping label update."
                echo "Ensure node has label 'stage.$branch_name=true' set manually."
                # Do not exit 1, allow deployment to proceed
            fi
            # Create network if it doesn't exist (on the server)
            docker network ls | grep -q "onton-network-$branch_name" || docker network create --driver overlay --attachable "onton-network-$branch_name" || true

            echo "Deploying Docker stack for $branch_name using $COMPOSE_FILE..."
            # Temporarily disable errexit for the capture
            set +o errexit
            deploy_output=\$(docker stack deploy --with-registry-auth -c $COMPOSE_FILE $branch_name 2>&1)
            deploy_status=\$?
            set -o errexit
          
            echo "\$deploy_output"

            if [ \$deploy_status -ne 0 ]; then
                echo "Error: Deployment failed with exit code \$deploy_status."
                exit 1
            fi
            if echo "\$deploy_output" | grep -q "could not be accessed on a registry"; then
              echo "Error: Registry access issue detected during deployment."
              exit 1
            fi
            echo "Forcing update of services..."
            services=\$(echo "$services_to_build" | tr -d '[]"' | tr ',' ' ')
            underscore="_"
            echo $services_to_build
            for service in \$services; do
              echo "Processing service: \$service"
              if [ "\$service" == "caddy" ]; then
                echo "docker service update --force ${branch_name}_caddy"
                docker service update --force ${branch_name}_caddy
              elif [ "\$service" == "mini-app" ]; then
                echo "Special handling for mini-app service"
                echo "Updating $branch_name_mini-app"
                docker service update --update-failure-action rollback --update-max-failure-ratio 0.2 --force ${branch_name}_mini-app
          
                echo "Updating $branch_name_mini-app-notification-socket"
                docker service update --update-failure-action rollback --update-max-failure-ratio 0.2 --force ${branch_name}_mini-app-notification-socket
          
                echo "Updating $branch_name_mini-app-poa-worker"
                docker service update --update-failure-action rollback --update-max-failure-ratio 0.2 --force ${branch_name}_mini-app-poa-worker
          
                echo "Updating $branch_name_mini-app-sbt-worker"
                docker service update --update-failure-action rollback --update-max-failure-ratio 0.2 --force ${branch_name}_mini-app-sbt-worker
                
                echo "Updating $branch_name_mini-app-nft-api-worker"
                docker service update --update-failure-action rollback --update-max-failure-ratio 0.2 --force ${branch_name}_mini-app-nft-api-worker
          
          
                echo "Updating $branch_name_mini-app-ordinary-worker"
                docker service update --update-failure-action rollback --update-max-failure-ratio 0.2 --force ${branch_name}_mini-app-ordinary-worker
          
                echo "Updating $branch_name_mini-app-reward-worker"
                docker service update --update-failure-action rollback --update-max-failure-ratio 0.2 --force ${branch_name}_mini-app-reward-worker
          
                echo "Updating $branch_name_mini-app-moderation-bot"
                docker service update --update-failure-action rollback --update-max-failure-ratio 0.2 --force ${branch_name}_mini-app-moderation-bot
              else
                echo "docker service update --force ${branch_name}_\${service}"
                docker service update --update-failure-action rollback --update-max-failure-ratio 0.2  --force ${branch_name}_\${service}
              fi
            done
            # bidar kardane fluentd :))
            docker service update --update-failure-action rollback --update-max-failure-ratio 0.5 --force ${branch_name}_fluentd
            echo "Services deployed successfully."         
          EOF

          echo "Services deployed successfully."
      - name: Cleanup Environment Variables File
        if: always()
        run: |
          echo "Cleaning up environment variables script..."
          #rm -f .env
          echo "Environment variables script deleted successfully."

      - name: Send Telegram Message - Deployment Success
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: Telegram vars are not set or are empty."
            exit 1
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="
            ✅Deployed Finnished for ${{ github.repository }}
            🧑 ‍💻Actor: ${{ github.actor }}
            📝 branch: ${{ github.ref }}
            ✅✅✅deployment completed✅✅✅
            "
      - name: Send Telegram Message - Deployment Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN_FOR_DEPLOYMENT }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID_FOR_DEPLOYMENT }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: Telegram vars are not set or are empty."
            exit 1
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="
            Hi there! 
            🔄 Deployment Finished for ${{ github.repository }}
          
            🧑 ‍💻Actor: ${{ github.actor }}
          
            📝 branch: ${{ github.ref }}
          
            ❌ ❌ deployment failed ❌ ❌ 
            "
