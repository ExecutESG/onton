name: Inspect Swarm Server

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform: inspect, disk-cleanup, purge-cloudflare, or custom"
        required: false
        default: "inspect"
      custom_command:
        description: "Custom command to run on server (when action=custom)"
        required: false
        default: ""

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare Cache
        if: ${{ github.event.inputs.action == 'purge-cloudflare' }}
        env:
          CF_ZONE: ${{ secrets.MAIN_CLOUDFLARE_DNS_ZONE_ID }}
          CF_TOKEN_MAIN: ${{ secrets.MAIN_CLOUDFLARE_API_TOKEN_MAIN }}
          CF_TOKEN: ${{ secrets.MAIN_CLOUDFLARE_API_TOKEN }}
          CF_EMAIL_MAIN: ${{ secrets.MAIN_CLOUDFLARE_EMAIL_MAIN }}
          CF_EMAIL: ${{ secrets.MAIN_CLOUDFLARE_EMAIL }}
        run: |
          echo "Purging Cloudflare cache for Zone $CF_ZONE..."
          purge_success=false

          for token in "$CF_TOKEN_MAIN" "$CF_TOKEN"; do
            [ -z "$token" ] && continue

            # Try Bearer token
            echo "Attempting purge with Bearer token..."
            response=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            echo "Response: $response"
            if echo "$response" | grep -q '"success":true'; then
              echo "Cloudflare cache purged successfully via Bearer token!"
              purge_success=true
              break
            fi

            # Try X-Auth-Key with email
            for email in "$CF_EMAIL_MAIN" "$CF_EMAIL"; do
              [ -z "$email" ] && continue
              echo "Attempting purge with X-Auth-Key ($email)..."
              response=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
                -H "X-Auth-Email: $email" \
                -H "X-Auth-Key: $token" \
                -H "Content-Type: application/json" \
                --data '{"purge_everything":true}')
              echo "Response: $response"
              if echo "$response" | grep -q '"success":true'; then
                echo "Cloudflare cache purged successfully via X-Auth-Key!"
                purge_success=true
                break 2
              fi
            done
          done

          if [ "$purge_success" = "false" ]; then
            echo "Error: Failed to purge Cloudflare cache with all available credentials"
            exit 1
          fi

      - name: Start SSH Agent and Add Key
        if: ${{ github.event.inputs.action != 'purge-cloudflare' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run Diagnostics on Swarm Manager
        if: ${{ github.event.inputs.action != 'purge-cloudflare' }}
        env:
          SSH_IP: ${{ secrets.SSH_DEV_IP }}
          SSH_PORT: ${{ secrets.SSH_DEV_PORT }}
          ACTION: ${{ github.event.inputs.action || 'inspect' }}
          CUSTOM_COMMAND: ${{ github.event.inputs.custom_command || '' }}
        run: |
          ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" tonont@$SSH_IP bash -s -- "$ACTION" "$CUSTOM_COMMAND" << 'EOF'
            set -o errexit
            set -o pipefail

            ACTION="$1"
            shift
            CUSTOM_COMMAND="$*"

            echo "=== CURRENT DISK USAGE ==="
            df -h

            echo "=== DOCKER SYSTEM DF ==="
            docker system df

            if [ "$ACTION" = "disk-cleanup" ]; then
              echo "=== CLEANING UP DOCKER RESOURCES ==="
              echo "Pruning dangling containers..."
              docker container prune -f
              echo "Pruning unreferenced images older than 24h..."
              docker image prune -af --filter "until=24h"
              echo "Pruning build cache..."
              docker builder prune -f || true
              echo "=== DISK USAGE AFTER CLEANUP ==="
              df -h
              docker system df
              exit 0
            fi

            if [ "$ACTION" = "custom" ] && [ -n "$CUSTOM_COMMAND" ]; then
              echo "=== EXECUTING CUSTOM COMMAND ==="
              eval "$CUSTOM_COMMAND"
              exit 0
            fi

            echo "=== DOCKER STACK LIST ==="
            docker stack ls

            echo "=== DOCKER SERVICE LIST ==="
            docker service ls

            echo "=== SERVICE INSPECT ONTON MINI-APP ==="
            docker service inspect onton_mini-app --format "onton_mini-app Image: {{.Spec.TaskTemplate.ContainerSpec.Image}}" || true
            docker service ps onton_mini-app --no-trunc || true

            echo "=== ALL RUNNING DOCKER CONTAINERS (ps) ==="
            docker ps --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}"
          EOF
