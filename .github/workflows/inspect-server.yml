name: Inspect Swarm Server

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform: inspect, disk-cleanup, purge-cloudflare, update-caddy-prod, update-prod-dns, or custom"
        required: false
        default: "inspect"
      target_server:
        description: "Target server: dev or main"
        required: false
        default: "dev"
      dns_ip:
        description: "Target IP for Cloudflare DNS update (when action=update-prod-dns)"
        required: false
        default: "65.109.212.86"
      custom_command:
        description: "Custom command to run on server (when action=custom)"
        required: false
        default: ""

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Purge Cloudflare Cache
        if: ${{ github.event.inputs.action == 'purge-cloudflare' }}
        env:
          CF_ZONE: ${{ secrets.MAIN_CLOUDFLARE_DNS_ZONE_ID }}
          CF_TOKEN_MAIN: ${{ secrets.MAIN_CLOUDFLARE_API_TOKEN_MAIN }}
          CF_TOKEN: ${{ secrets.MAIN_CLOUDFLARE_API_TOKEN }}
          CF_EMAIL_MAIN: ${{ secrets.MAIN_CLOUDFLARE_EMAIL_MAIN }}
          CF_EMAIL: ${{ secrets.MAIN_CLOUDFLARE_EMAIL }}
        run: |
          echo "Purging Cloudflare cache for Zone $CF_ZONE..."
          echo "Querying prod.onton.live and all DNS records..."
          curl -s "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?name=prod.onton.live" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json"
          echo ""
          curl -s "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?name=onton.live" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json"
          echo ""
          echo "Done Cloudflare DNS check"

      - name: Update Cloudflare DNS to Active Host
        if: ${{ github.event.inputs.action == 'update-prod-dns' }}
        env:
          CF_ZONE: ${{ secrets.MAIN_CLOUDFLARE_DNS_ZONE_ID }}
          CF_TOKEN: ${{ secrets.MAIN_CLOUDFLARE_API_TOKEN }}
        run: |
          RECORD_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?name=prod.onton.live" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" | jq -r '.result[0].id')
          echo "Found Record ID: $RECORD_ID"
          TARGET_IP="${{ github.event.inputs.dns_ip || '65.109.212.86' }}"
          echo "Updating prod.onton.live to $TARGET_IP..."
          RESPONSE=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$RECORD_ID" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"type\":\"A\",\"name\":\"prod.onton.live\",\"content\":\"$TARGET_IP\",\"ttl\":1,\"proxied\":true,\"comment\":\"prod main swarm host\"}")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "DNS updated successfully to $TARGET_IP!"
          else
            echo "Error updating DNS: $RESPONSE"
            exit 1
          fi

      - name: Start SSH Agent and Add Key
        if: ${{ github.event.inputs.action != 'purge-cloudflare' && github.event.inputs.action != 'update-prod-dns' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run Update Caddy Prod
        if: ${{ github.event.inputs.action == 'update-caddy-prod' }}
        env:
          SSH_IP: ${{ secrets.SSH_DEV_IP }}
          SSH_PORT: ${{ secrets.SSH_DEV_PORT }}
        run: |
          scp -o StrictHostKeyChecking=no -P "$SSH_PORT" devops/update_caddy_prod.sh tonont@$SSH_IP:/home/tonont/update_caddy_prod.sh
          ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" tonont@$SSH_IP bash /home/tonont/update_caddy_prod.sh

      - name: Run Diagnostics on Swarm Manager
        if: ${{ github.event.inputs.action != 'purge-cloudflare' && github.event.inputs.action != 'update-prod-dns' && github.event.inputs.action != 'update-caddy-prod' }}
        env:
          SSH_IP: ${{ (github.event.inputs.target_server == 'main') && secrets.SSH_MAIN_IP || secrets.SSH_DEV_IP }}
          SSH_PORT: ${{ (github.event.inputs.target_server == 'main') && secrets.SSH_MAIN_PORT || secrets.SSH_DEV_PORT }}
          ACTION: ${{ github.event.inputs.action || 'inspect' }}
          CUSTOM_COMMAND: ${{ github.event.inputs.custom_command || '' }}
        run: |
          ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" tonont@$SSH_IP bash -s -- "$ACTION" "$CUSTOM_COMMAND" << 'EOF'
            set -o errexit
            set -o pipefail

            ACTION="$1"
            shift
            CUSTOM_COMMAND="$*"

            echo "=== CURRENT DISK USAGE ==="
            df -h

            echo "=== DOCKER SYSTEM DF ==="
            docker system df

            if [ "$ACTION" = "disk-cleanup" ]; then
              echo "=== CLEANING UP DOCKER RESOURCES ==="
              echo "Pruning dangling containers..."
              docker container prune -f
              echo "Pruning unreferenced images older than 24h..."
              docker image prune -af --filter "until=24h"
              echo "Pruning build cache..."
              docker builder prune -f || true
              echo "=== DISK USAGE AFTER CLEANUP ==="
              df -h
              docker system df
              exit 0
            fi

            if [ "$ACTION" = "custom" ] && [ -n "$CUSTOM_COMMAND" ]; then
              echo "=== EXECUTING CUSTOM COMMAND ==="
              eval "$CUSTOM_COMMAND"
              exit 0
            fi

            echo "=== DOCKER STACK LIST ==="
            docker stack ls

            echo "=== DOCKER SERVICE LIST ==="
            docker service ls

            echo "=== SERVICE INSPECT ONTON MINI-APP ==="
            docker service inspect onton_mini-app --format "onton_mini-app Image: {{.Spec.TaskTemplate.ContainerSpec.Image}}" || true
            docker service ps onton_mini-app --no-trunc || true

            echo "=== ALL RUNNING DOCKER CONTAINERS (ps) ==="
            docker ps --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}"
          EOF
